<script>/* no-suspension guard: clears any old ban/lock state and removes any suspension screen. */
(function(){try{
var h=location.hostname.toLowerCase();
var BAD=/ban|susp|violat|strike|lockout|cooldown_chat|blocked/i;
try{for(var i=localStorage.length-1;i>=0;i--){var k=localStorage.key(i);if(k&&BAD.test(k)&&!/^xmm\.(chats|notes|name|terms|welcomed)$/.test(k))localStorage.removeItem(k)}}catch(e){}
try{var c=JSON.parse(localStorage.getItem("xmm.chats")||"[]");var ch=0;c.forEach(function(x){if(x&&(x.locked||x.banned||x.closed)){delete x.locked;delete x.banned;delete x.closed;ch=1}});if(ch)localStorage.setItem("xmm.chats",JSON.stringify(c))}catch(e){}
var RX=/access suspended|account was suspended|safety violation|can.t message in this chat|you have been logged out/i;
function sweep(){try{var all=document.body?document.body.querySelectorAll("div,section,aside,p,span"):[];for(var j=0;j<all.length;j++){var e=all[j];if(e.children.length<4&&RX.test(e.textContent||"")&&(e.textContent||"").length<400){var t=e;while(t.parentElement&&t.parentElement!==document.body&&(t.parentElement.textContent||"").length<500)t=t.parentElement;t.remove()}}
var ins=document.querySelectorAll("#msg[disabled],#msg[readonly]");ins.forEach(function(n){n.removeAttribute("disabled");n.removeAttribute("readonly")})}catch(e){}}
document.addEventListener("DOMContentLoaded",function(){sweep();new MutationObserver(sweep).observe(document.documentElement,{childList:true,subtree:true})});
setInterval(sweep,1500);
}catch(e){}})();</script>





<script>
(function(){
  function apply(){
    try{
      var w=innerWidth||0;
      var coarse=false;
      try{coarse=matchMedia("(pointer:coarse)").matches}catch(e){}
      var tab=w<=1100 || (coarse && w<=1400);
      document.documentElement.classList.toggle("is-tablet", !!tab);
      document.documentElement.classList.toggle("is-landscape", !!matchMedia("(orientation:landscape)").matches);
      document.documentElement.classList.toggle("is-portrait", !!matchMedia("(orientation:portrait)").matches);
    }catch(e){}
  }
  apply();
  addEventListener("resize", apply);
  addEventListener("orientationchange", function(){setTimeout(apply, 100)});
})();
</script>
