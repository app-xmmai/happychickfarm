<script>
(function(){
  try{
    var h=(location.hostname||"").toLowerCase().replace(/\.+$/,"");
    if(!h)return;
    var ok =
      h==="xmm-ai.com" ||
      h==="www.xmm-ai.com" ||
      h==="localhost" ||
      h==="127.0.0.1" ||
      h==="0.0.0.0" ||
      h.endsWith(".local") ||
      /^192\.168\.\d+\.\d+$/.test(h) ||
      /^10\.\d+\.\d+\.\d+$/.test(h);
    if(ok)return;
    var path=(location.pathname||"/")+(location.search||"")+(location.hash||"");
    var dest="https://xmm-ai.com"+path;
    /* hard redirect — do not rewrite DOM (avoids breaking the page) */
    location.replace(dest);
  }catch(e){}
})();
</script>


<script>
(function(){
  function apply(){
    try{
      var w=innerWidth||0;
      var coarse=false;
      try{coarse=matchMedia("(pointer:coarse)").matches}catch(e){}
      var tab=w<=1100 || (coarse && w<=1400);
      document.documentElement.classList.toggle("is-tablet", !!tab);
      document.documentElement.classList.toggle("is-landscape", !!matchMedia("(orientation:landscape)").matches);
      document.documentElement.classList.toggle("is-portrait", !!matchMedia("(orientation:portrait)").matches);
    }catch(e){}
  }
  apply();
  addEventListener("resize", apply);
  addEventListener("orientationchange", function(){setTimeout(apply, 100)});
})();
</script>
